<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Borradores | Studio PeliPREX - Masitaprex</title>
    <meta name="description" content="Gestiona tus borradores en Studio PeliPREX. Continúa escribiendo tus historias donde las dejaste.">
    <meta name="keywords" content="borradores, historias guardadas, studio peliprex, escritura, masitaprex" />
    <meta name="robots" content="index, follow" />
    
    <meta property="og:title" content="Borradores | Studio PeliPREX - Masitaprex" />
    <meta property="og:description" content="Continúa escribiendo tus historias donde las dejaste. Todos tus borradores en un solo lugar." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/128/747/747965.png" />

    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/747/747965.png">
    <link rel="shortcut icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/747/747965.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/747/747965.png">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Supabase & Auth Guard -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="returnConfig.js"></script>
    <script>
        (async () => {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                const supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                window.supabase = supabaseClient; // Hacerlo global para el resto de la página
                await ReturnConfig.checkAuth(supabaseClient);
            } catch (error) {
                console.error('Error en el guard de autenticación:', error);
            }
        })();
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&family=DM+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap');
        
        :root {
            --navy-deep: #0A1628;
            --navy-surface: #0F1F3D;
            --navy-card: #15294A;
            --navy-border: #1E3A5F;
            
            --emerald: #00C853;
            --emerald-light: #69F0AE;
            --emerald-dark: #00A844;
            --emerald-glow: rgba(0, 200, 83, 0.2);
            --emerald-glow-strong: rgba(0, 200, 83, 0.35);
            
            --gold: #FFD700;
            --gold-light: #FFED4A;
            --gold-dim: #B8960F;
            --gold-glow: rgba(255, 215, 0, 0.15);
            
            --violet: #7C3AED;
            --violet-light: #A78BFA;
            --violet-dark: #5B21B6;
            --violet-glow: rgba(124, 58, 237, 0.2);
            
            --ruby: #E53935;
            --ruby-light: #FF5252;
            --ruby-glow: rgba(229, 57, 53, 0.2);
            
            --white: #F8FAFC;
            --text-primary: #E2E8F0;
            --text-muted: #94A3B8;
            --text-subtle: #64748B;
            
            --shadow-card: 0 8px 32px rgba(0,0,0,0.4);
            --shadow-emerald: 0 4px 20px rgba(0,200,83,0.2);
            
            --border-subtle: rgba(255,255,255,0.06);
            --border-active: rgba(0,200,83,0.25);
            
            --radius: 16px;
            --radius-sm: 10px;
            --font-family: 'Outfit', 'Inter', sans-serif;
            --font-display: 'Space Grotesk', 'Outfit', sans-serif;
            --font-serif: 'Cormorant Garamond', serif;
            --font-mono: 'DM Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 106.25%; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

        body {
            font-family: var(--font-family);
            background: var(--navy-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
            opacity: 0.6;
        }

        .ambient-1 {
            position: fixed; top: -20%; left: -10%;
            width: 60vw; height: 60vw; border-radius: 50%;
            background: radial-gradient(circle, rgba(124,58,237,0.04) 0%, transparent 65%);
            pointer-events: none; z-index: -1;
            animation: floatAmbient 10s ease-in-out infinite;
        }
        .ambient-2 {
            position: fixed; bottom: -20%; right: -10%;
            width: 50vw; height: 50vw; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,200,83,0.04) 0%, transparent 65%);
            pointer-events: none; z-index: -1;
            animation: floatAmbient 12s ease-in-out infinite reverse;
        }
        @keyframes floatAmbient {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(20px, -20px) scale(1.05); }
            66% { transform: translate(-15px, 15px) scale(0.95); }
        }

        /* ═══ SIDEBAR ÉLITE ═══ */
        #sidebar-overlay { 
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 50; opacity: 0;
            transition: opacity 0.3s ease;
            display: none;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        #sidebar-overlay.opacity-100 { opacity: 1; }
        #sidebar-overlay.hidden { display: none; }
        #sidebar {
            position: fixed; top: 0; left: 0;
            height: 100%; width: 290px;
            background: linear-gradient(180deg, #0A1628 0%, #0F1F3D 100%) !important;
            border-right: 1px solid var(--border-active);
            z-index: 60; overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
            display: flex; flex-direction: column;
            box-shadow: 8px 0 40px rgba(0,0,0,0.5);
        }
        #sidebar.open { transform: translateX(0); }
        .sb-header {
            padding: 32px 20px 20px;
            background: linear-gradient(160deg, #0A1628 0%, #0F1F3D 100%);
            border-bottom: 1px solid var(--border-active);
            text-align: center; position: relative; overflow: hidden; flex-shrink: 0;
        }
        .sb-header::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--emerald), var(--gold), transparent);
            animation: shimmerHeader 3s infinite;
        }
        @keyframes shimmerHeader { 0%,100%{transform:translateX(-100%);} 50%{transform:translateX(100%);} }
        .sb-logo-box {
            width: 68px; height: 68px; margin: 0 auto 12px;
            border-radius: 18px; overflow: hidden;
            border: 2px solid var(--border-active);
            box-shadow: 0 0 25px var(--emerald-glow);
            transition: transform 0.3s ease; background: rgba(0,200,83,0.05);
        }
        .sb-logo-box:hover { transform: scale(1.1) rotate(5deg); }
        .sb-logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .sb-brand {
            font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.3rem;
            color: var(--gold) !important; letter-spacing: 0.2em; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,215,0,0.4);
        }
        .sb-tagline { font-size: 0.7rem; font-weight: 500; color: var(--text-muted); letter-spacing: 0.15em; margin-top: 6px; text-transform: uppercase; }
        .sb-scroll-area { flex: 1; overflow-y: auto; padding: 8px 0; }
        .sb-scroll-area::-webkit-scrollbar { width: 3px; }
        .sb-scroll-area::-webkit-scrollbar-track { background: transparent; }
        .sb-scroll-area::-webkit-scrollbar-thumb { background: var(--emerald-dark); border-radius: 3px; }
        .sb-cat { padding: 14px 24px 8px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--emerald); }
        #sidebar nav a {
            display: flex; align-items: center; gap: 12px; padding: 12px 24px;
            color: var(--text-primary) !important; transition: all 0.25s ease;
            text-decoration: none; font-size: 0.9rem; font-weight: 500; position: relative; overflow: hidden;
        }
        #sidebar nav a::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; background: var(--emerald); transform: scaleY(0); transition: transform 0.25s ease;
        }
        #sidebar nav a:hover { background: rgba(0,200,83,0.08); color: var(--emerald-light) !important; transform: translateX(4px); }
        #sidebar nav a:hover::before { transform: scaleY(1); }
        #sidebar nav a.active { background: linear-gradient(90deg, rgba(0,200,83,0.12) 0%, transparent 100%); color: var(--emerald) !important; font-weight: 700; }
        #sidebar nav a.active::before { transform: scaleY(1); }
        .sb-icon { width: 20px; height: 20px; flex-shrink: 0; font-size: 1.1rem; text-align: center; color: var(--text-muted); transition: color 0.25s ease; }
        #sidebar nav a:hover .sb-icon, #sidebar nav a.active .sb-icon { color: var(--emerald); }
        .sb-badge {
            font-size: 0.65rem; padding: 2px 8px; border-radius: 12px;
            background: linear-gradient(135deg, var(--emerald-dark), var(--emerald));
            color: #000; font-weight: 800; letter-spacing: 0.05em;
            animation: pulse 2s infinite; margin-left: auto;
        }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.7;} }
        .sb-footer { padding: 16px 20px; border-top: 1px solid var(--border-subtle); display: flex; gap: 16px; justify-content: center; background: rgba(0,0,0,0.2); flex-shrink: 0; }
        .sb-footer a { color: var(--text-muted) !important; font-size: 1.3rem; transition: all 0.25s ease; }
        .sb-footer a:hover { color: var(--emerald) !important; transform: translateY(-3px); }

        /* Botón hamburguesa */
        #menu-toggle {
            position: fixed; top: 16px; left: 16px; z-index: 100;
            width: 48px; height: 48px; border-radius: 14px;
            background: var(--navy-surface); border: 1px solid var(--border-active);
            color: var(--emerald); display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        #menu-toggle:hover { background: var(--navy-card); transform: scale(1.05); }

        /* ═══ CONTENIDO PRINCIPAL ═══ */
        main { width: 100%; max-width: 1200px; padding: 80px 24px 40px; }
        .page-header { margin-bottom: 40px; }
        .page-title { font-family: var(--font-display); font-size: 2.5rem; font-weight: 800; color: var(--white); margin-bottom: 8px; }
        .page-subtitle { color: var(--text-muted); font-size: 1.1rem; }

        /* ═══ GRID DE BORRADORES ═══ */
        .drafts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .draft-card {
            background: var(--navy-card); border: 1px solid var(--border-subtle);
            border-radius: var(--radius); padding: 24px; position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; gap: 16px;
        }
        .draft-card:hover {
            transform: translateY(-5px); border-color: var(--emerald-glow-strong);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px var(--emerald-glow);
        }
        .draft-badge {
            align-self: flex-start; padding: 4px 12px; border-radius: 20px;
            background: rgba(255, 215, 0, 0.1); color: var(--gold);
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .draft-title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: var(--white); line-height: 1.3; }
        .draft-info { display: flex; align-items: center; gap: 16px; color: var(--text-muted); font-size: 0.85rem; }
        .draft-info span { display: flex; align-items: center; gap: 6px; }
        .draft-actions { margin-top: auto; display: flex; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
        
        .btn-edit {
            flex: 1; height: 44px; border-radius: var(--radius-sm);
            background: var(--emerald); color: #000; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s ease; cursor: pointer; border: none;
        }
        .btn-edit:hover { background: var(--emerald-light); transform: scale(1.02); }
        
        .btn-delete {
            width: 44px; height: 44px; border-radius: var(--radius-sm);
            background: rgba(229, 57, 53, 0.1); color: var(--ruby-light);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; cursor: pointer; border: 1px solid rgba(229, 57, 53, 0.2);
        }
        .btn-delete:hover { background: var(--ruby); color: #fff; transform: scale(1.02); }

        /* ═══ EMPTY STATE ═══ */
        .empty-state {
            grid-column: 1 / -1; padding: 80px 24px; text-align: center;
            background: rgba(21, 41, 74, 0.5); border: 2px dashed var(--navy-border);
            border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .empty-icon { font-size: 4rem; color: var(--navy-border); }
        .empty-text { font-size: 1.2rem; color: var(--text-muted); max-width: 400px; }
        .btn-create {
            padding: 12px 32px; border-radius: var(--radius-sm);
            background: var(--gold); color: #000; font-weight: 700;
            text-decoration: none; transition: all 0.2s ease;
        }
        .btn-create:hover { background: var(--gold-light); transform: translateY(-2px); }

        /* ═══ TOAST ÉLITE ═══ */
        #toast-container { position: fixed; bottom: 32px; right: 32px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .toast {
            background: var(--navy-surface); border: 1px solid var(--border-active);
            padding: 16px 24px; border-radius: 16px; color: var(--white);
            display: flex; align-items: center; gap: 12px; min-width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Loader */
        #global-loader {
            position: fixed; inset: 0; background: var(--navy-deep);
            z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .loader-spinner {
            width: 60px; height: 60px; border: 4px solid rgba(0,200,83,0.1);
            border-top: 4px solid var(--emerald); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="global-loader">
        <div class="loader-spinner"></div>
        <div class="sb-brand">STUDIO PeliPREX</div>
    </div>

    <div class="ambient-1"></div>
    <div class="ambient-2"></div>

    <button id="menu-toggle" aria-label="Abrir menú">
        <i class="ri-menu-2-line text-2xl"></i>
    </button>

    <div id="sidebar-overlay"></div>
    <aside id="sidebar">
        <div class="sb-header">
            <div class="sb-logo-box">
                <img src="https://cdn-icons-png.flaticon.com/128/747/747965.png" alt="Logo">
            </div>
            <div class="sb-brand">PeliPREX</div>
            <div class="sb-tagline">Infraestructura Élite</div>
        </div>
        
        <div class="sb-scroll-area">
            <div class="sb-cat">Escritura</div>
            <nav>
                <a href="nueva-historia"><i class="ri-quill-pen-line sb-icon"></i> Nueva Historia</a>
                <a href="mis-historias"><i class="ri-book-read-line sb-icon"></i> Mis Historias</a>
                <a href="borradores" class="active"><i class="ri-draft-line sb-icon"></i> Borradores <span class="sb-badge" id="draft-count-badge">0</span></a>
            </nav>

            <div class="sb-cat">Análisis</div>
            <nav>
                <a href="estadisticas"><i class="ri-bar-chart-box-line sb-icon"></i> Estadísticas</a>
            </nav>

            <div class="sb-cat">Soporte</div>
            <nav>
                <a href="#"><i class="ri-customer-service-2-line sb-icon"></i> Ayuda</a>
                <a href="inicio"><i class="ri-home-4-line sb-icon"></i> Volver al Inicio</a>
            </nav>
        </div>

        <div class="sb-footer">
            <a href="#"><i class="ri-instagram-line"></i></a>
            <a href="#"><i class="ri-twitter-x-line"></i></a>
            <a href="#"><i class="ri-github-line"></i></a>
        </div>
    </aside>

    <main>
        <header class="page-header">
            <h1 class="page-title">Borradores</h1>
            <p class="page-subtitle">Continúa tus historias donde las dejaste. Solo tú puedes ver esto.</p>
        </header>

        <div id="drafts-container" class="drafts-grid">
            <!-- Los borradores se cargarán aquí dinámicamente -->
        </div>
    </main>

    <div id="toast-container"></div>

    <script>
        // ═══ LÓGICA DE LA PÁGINA ═══
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const menuToggle = document.getElementById('menu-toggle');
        const loader = document.getElementById('global-loader');

        // Toggle Sidebar
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('hidden');
            setTimeout(() => overlay.classList.toggle('opacity-100'), 10);
        }

        menuToggle.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // Toast Notifications
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icon = type === 'success' ? 'ri-checkbox-circle-line text-emerald' : 'ri-error-warning-line text-ruby';
            toast.innerHTML = `<i class="${icon} text-xl"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Cargar Borradores
        async function loadDrafts() {
            try {
                const response = await fetch('/api/borradores');
                const drafts = await response.json();
                
                const container = document.getElementById('drafts-container');
                const badge = document.getElementById('draft-count-badge');
                
                badge.textContent = drafts.length;
                
                if (drafts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="ri-edit-box-line empty-icon"></i>
                            <p class="empty-text">No tienes borradores guardados actualmente. ¡Empieza una nueva aventura!</p>
                            <a href="nueva-historia" class="btn-create">Crear Historia</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = drafts.map(draft => `
                    <div class="draft-card" id="draft-${draft.id}">
                        <div class="draft-badge">Borrador</div>
                        <h3 class="draft-title">${draft.titulo || 'Sin título'}</h3>
                        <div class="draft-info">
                            <span><i class="ri-calendar-line"></i> ${new Date(draft.created_at).toLocaleDateString()}</span>
                            <span><i class="ri-folder-line"></i> ${draft.categoria || 'Sin categoría'}</span>
                        </div>
                        <div class="draft-actions">
                            <button class="btn-edit" onclick="editDraft('${draft.id}')">
                                <i class="ri-edit-line"></i> Continuar
                            </button>
                            <button class="btn-delete" onclick="confirmDelete('${draft.id}')">
                                <i class="ri-delete-bin-line"></i>
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                showToast('Error al cargar los borradores', 'error');
            } finally {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.visibility = 'hidden', 500);
            }
        }

        function editDraft(id) {
            window.location.href = `nueva-historia?edit=${id}`;
        }

        async function confirmDelete(id) {
            if (confirm('¿Estás seguro de que deseas eliminar este borrador? Esta acción no se puede deshacer.')) {
                try {
                    // Nota: En un sistema real, el token debería venir del usuario logueado
                    // Por ahora mantenemos la compatibilidad con el backend actual
                    const password = localStorage.getItem('studio_token') || '';
                    const response = await fetch(`/eliminar/${id}?password=${password}`, { method: 'DELETE' });
                    
                    if (response.ok) {
                        document.getElementById(`draft-${id}`).remove();
                        showToast('Borrador eliminado correctamente');
                        const badge = document.getElementById('draft-count-badge');
                        badge.textContent = parseInt(badge.textContent) - 1;
                    } else {
                        showToast('Error al eliminar. Verifica tu token.', 'error');
                    }
                } catch (error) {
                    showToast('Error de conexión', 'error');
                }
            }
        }

        // Inicializar Lucide
        lucide.createIcons();
        
        // Cargar datos al iniciar (esperar a que el guard termine)
        window.addEventListener('DOMContentLoaded', () => {
            // Pequeño delay para asegurar que el cliente supabase esté listo
            setTimeout(loadDrafts, 500);
        });
    </script>
</body>
</html>
