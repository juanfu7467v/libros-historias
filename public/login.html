<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login | Studio PeliPREX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="returnConfig.js"></script>
  <style>
    :root {
        --primary: #007bff;
        --secondary: #00e676;
        --button-gradient: linear-gradient(135deg, #0072ff 0%, #00e676 100%);
        --bg-gradient: radial-gradient(circle at top right, #fdfbfb 0%, #ebedee 100%);
    }
    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-gradient);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .login-card {
        background: white;
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
    }
    .input-field {
        width: 100%;
        height: 54px;
        padding: 0 20px;
        border: 2px solid #f1f5f9;
        border-radius: 12px;
        margin-bottom: 16px;
        outline: none;
        transition: border-color 0.3s;
    }
    .input-field:focus { border-color: var(--primary); }
    .btn-primary {
        width: 100%;
        height: 54px;
        background: var(--button-gradient);
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s;
    }
    .btn-primary:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-8">
        <img src="https://cdn-icons-png.flaticon.com/128/747/747965.png" class="w-16 h-16 mx-auto mb-4" alt="Logo">
        <h1 class="text-2xl font-bold text-gray-800">Studio PeliPREX</h1>
        <p class="text-gray-500">Inicia sesión para continuar</p>
    </div>

    <form id="login-form">
        <input type="email" id="email" class="input-field" placeholder="Correo electrónico" required>
        <input type="password" id="password" class="input-field" placeholder="Contraseña" required>
        <button type="submit" class="btn-primary">ENTRAR</button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-500">
        ¿No tienes cuenta? <a href="#" class="text-blue-600 font-semibold">Regístrate</a>
    </div>
  </div>

  <script>
    let supabaseClient;

    async function initSupabase() {
        try {
            const response = await fetch('/api/config');
            const config = await response.json();
            supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
            
            // Guardar return_to en sesión si viene en URL
            ReturnConfig.saveReturnToSession();

            // Verificar si ya está logueado
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                ReturnConfig.redirectAfterAuth(session);
            }
        } catch (error) {
            console.error('Error inicializando Supabase:', error);
        }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                alert('Error: ' + error.message);
            } else {
                ReturnConfig.redirectAfterAuth(data.session);
            }
        } catch (err) {
            alert('Error inesperado al iniciar sesión');
        }
    });

    initSupabase();
  </script>
</body>
</html>
