<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Estadísticas | Studio PeliPREX - Masitaprex</title>
    <meta name="description" content="Estadísticas de tus historias en Studio PeliPREX. Visualiza lectores, vistas, valoraciones y el rendimiento de tus obras.">
    <meta name="keywords" content="estadisticas escritor, metricas historias, studio peliprex, rendimiento obras, masitaprex" />
    <meta name="robots" content="index, follow" />
    
    <meta property="og:title" content="Estadísticas | Studio PeliPREX - Masitaprex" />
    <meta property="og:description" content="Visualiza el rendimiento de tus historias. Lectores, vistas, valoraciones y más." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/128/747/747965.png" />

    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/747/747965.png">
    <link rel="shortcut icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/747/747965.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/747/747965.png">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Supabase & Auth Guard -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="returnConfig.js"></script>
    <script>
        (async () => {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                const supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                window.supabase = supabaseClient;
                await ReturnConfig.checkAuth(supabaseClient);
            } catch (error) {
                console.error('Error en el guard de autenticación:', error);
            }
        })();
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&family=DM+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap');
        
        :root {
            --navy-deep: #0A1628;
            --navy-surface: #0F1F3D;
            --navy-card: #15294A;
            --navy-border: #1E3A5F;
            --emerald: #00C853;
            --emerald-light: #69F0AE;
            --emerald-dark: #00A844;
            --emerald-glow: rgba(0, 200, 83, 0.2);
            --emerald-glow-strong: rgba(0, 200, 83, 0.35);
            --gold: #FFD700;
            --gold-light: #FFED4A;
            --gold-dim: #B8960F;
            --gold-glow: rgba(255, 215, 0, 0.15);
            --violet: #7C3AED;
            --violet-light: #A78BFA;
            --violet-dark: #5B21B6;
            --violet-glow: rgba(124, 58, 237, 0.2);
            --ruby: #E53935;
            --ruby-light: #FF5252;
            --ruby-glow: rgba(229, 57, 53, 0.2);
            --white: #F8FAFC;
            --text-primary: #E2E8F0;
            --text-muted: #94A3B8;
            --text-subtle: #64748B;
            --shadow-card: 0 8px 32px rgba(0,0,0,0.4);
            --border-subtle: rgba(255,255,255,0.06);
            --border-active: rgba(0,200,83,0.25);
            --radius: 16px;
            --radius-sm: 10px;
            --font-family: 'Outfit', 'Inter', sans-serif;
            --font-display: 'Space Grotesk', 'Outfit', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 106.25%; scroll-behavior: smooth; }

        body {
            font-family: var(--font-family);
            background: var(--navy-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ═══ SIDEBAR ÉLITE ═══ */
        #sidebar-overlay { 
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
            z-index: 50; opacity: 0; transition: opacity 0.3s ease;
            display: none; backdrop-filter: blur(6px);
        }
        #sidebar-overlay.opacity-100 { opacity: 1; }
        #sidebar-overlay.hidden { display: none; }
        #sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 290px;
            background: linear-gradient(180deg, #0A1628 0%, #0F1F3D 100%) !important;
            border-right: 1px solid var(--border-active);
            z-index: 60; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%); display: flex; flex-direction: column;
        }
        #sidebar.open { transform: translateX(0); }
        .sb-header { padding: 32px 20px 20px; text-align: center; border-bottom: 1px solid var(--border-active); }
        .sb-logo-box { width: 68px; height: 68px; margin: 0 auto 12px; border-radius: 18px; border: 2px solid var(--border-active); }
        .sb-logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .sb-brand { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--gold) !important; letter-spacing: 0.2em; text-transform: uppercase; }
        .sb-scroll-area { flex: 1; overflow-y: auto; padding: 8px 0; }
        .sb-cat { padding: 14px 24px 8px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--emerald); }
        #sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 12px 24px; color: var(--text-primary) !important; text-decoration: none; font-size: 0.9rem; }
        #sidebar nav a:hover { background: rgba(0,200,83,0.08); color: var(--emerald-light) !important; }
        #sidebar nav a.active { background: linear-gradient(90deg, rgba(0,200,83,0.12) 0%, transparent 100%); color: var(--emerald) !important; font-weight: 700; }
        .sb-icon { width: 20px; font-size: 1.1rem; color: var(--text-muted); }
        
        #menu-toggle {
            position: fixed; top: 16px; left: 16px; z-index: 100;
            width: 48px; height: 48px; border-radius: 14px;
            background: var(--navy-surface); border: 1px solid var(--border-active);
            color: var(--emerald); display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* ═══ CONTENIDO ═══ */
        main { width: 100%; max-width: 1200px; padding: 80px 24px 40px; }
        .page-header { margin-bottom: 40px; }
        .page-title { font-size: 2.5rem; font-weight: 800; color: var(--white); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-bottom: 40px; }
        .stat-card {
            background: var(--navy-card); border: 1px solid var(--border-subtle);
            padding: 32px; border-radius: var(--radius); text-align: center;
        }
        .stat-value { font-size: 3rem; font-weight: 800; color: var(--emerald); line-height: 1; margin-bottom: 8px; }
        .stat-label { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; }

        .top-list { background: var(--navy-card); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 32px; }
        .list-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        .list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 0; border-bottom: 1px solid var(--border-subtle);
        }
        .list-item:last-child { border-bottom: none; }
        .item-name { font-weight: 600; color: var(--white); }
        .item-meta { color: var(--text-muted); font-size: 0.9rem; }
        .item-vistas { color: var(--gold); font-weight: 700; }

        #global-loader {
            position: fixed; inset: 0; background: var(--navy-deep);
            z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .loader-spinner {
            width: 60px; height: 60px; border: 4px solid rgba(0,200,83,0.1);
            border-top: 4px solid var(--emerald); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="global-loader">
        <div class="loader-spinner"></div>
        <div class="sb-brand">STUDIO PeliPREX</div>
    </div>

    <button id="menu-toggle"><i class="ri-menu-2-line text-2xl"></i></button>

    <div id="sidebar-overlay"></div>
    <aside id="sidebar">
        <div class="sb-header">
            <div class="sb-logo-box"><img src="https://cdn-icons-png.flaticon.com/128/747/747965.png" alt="Logo"></div>
            <div class="sb-brand">PeliPREX</div>
        </div>
        <div class="sb-scroll-area">
            <div class="sb-cat">Escritura</div>
            <nav>
                <a href="nueva-historia"><i class="ri-quill-pen-line sb-icon"></i> Nueva Historia</a>
                <a href="mis-historias"><i class="ri-book-read-line sb-icon"></i> Mis Historias</a>
                <a href="borradores"><i class="ri-draft-line sb-icon"></i> Borradores</a>
            </nav>
            <div class="sb-cat">Análisis</div>
            <nav>
                <a href="estadisticas" class="active"><i class="ri-bar-chart-box-line sb-icon"></i> Estadísticas</a>
            </nav>
            <div class="sb-cat">Soporte</div>
            <nav>
                <a href="inicio"><i class="ri-home-4-line sb-icon"></i> Volver al Inicio</a>
            </nav>
        </div>
    </aside>

    <main>
        <header class="page-header">
            <h1 class="page-title">Estadísticas</h1>
            <p class="page-subtitle">Rendimiento global de tus historias publicadas.</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-historias">-</div>
                <div class="stat-label">Historias Publicadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-vistas">-</div>
                <div class="stat-label">Vistas Totales</div>
            </div>
        </div>

        <div class="top-list">
            <h2 class="list-title"><i class="ri-trophy-line text-gold"></i> Top 10 Historias</h2>
            <div id="top-historias-container">
                <!-- Se cargará dinámicamente -->
            </div>
        </div>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const menuToggle = document.getElementById('menu-toggle');
        const loader = document.getElementById('global-loader');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('hidden');
            setTimeout(() => overlay.classList.toggle('opacity-100'), 10);
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.add('hidden');
            overlay.classList.remove('opacity-100');
        });

        async function loadStats() {
            try {
                const response = await fetch('/api/estadisticas');
                const data = await response.json();
                
                document.getElementById('total-historias').textContent = data.totalHistorias;
                document.getElementById('total-vistas').textContent = data.totalVistas.toLocaleString();
                
                const container = document.getElementById('top-historias-container');
                container.innerHTML = data.topHistorias.map(h => `
                    <div class="list-item">
                        <div>
                            <div class="item-name">${h.titulo}</div>
                            <div class="item-meta">${h.categoria}</div>
                        </div>
                        <div class="item-vistas">${h.vistas.toLocaleString()} vistas</div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error al cargar estadísticas:', error);
            } finally {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.visibility = 'hidden', 500);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadStats, 500);
        });
    </script>
</body>
</html>
