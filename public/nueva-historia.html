<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Studio PeliPREX - Creador de Historias | Masitaprex</title>
    <meta name="description" content="Studio PeliPREX - Gestor de Contenido Original. Crea y publica tus historias, novelas y cuentos en PeliPREX HD.">
    <meta name="keywords" content="peliprex, studio, crear historias, publicar, masitaprex, escritora, novelas, cuentos" />
    <meta name="robots" content="index, follow" />
    
    <meta property="og:title" content="Studio PeliPREX - Creador de Historias | Masitaprex" />
    <meta property="og:description" content="Crea y publica tus historias originales en PeliPREX HD. Gestor de Contenido Original v2.0." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/128/747/747965.png" />

    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/747/747965.png">
    <link rel="shortcut icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/747/747965.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/747/747965.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&family=DM+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Quill.js Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <!-- Supabase & Auth Guard -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="returnConfig.js"></script>
    <script>
        let currentUser = null;
        (async () => {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                const supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                window.supabase = supabaseClient;
                const session = await ReturnConfig.checkAuth(supabaseClient);
                if (session) {
                    currentUser = session.user;
                }
            } catch (error) {
                console.error('Error en el guard de autenticación:', error);
            }
        })();
    </script>
    
    <style>
        :root {
            --navy-deep: #0A1628;
            --navy-surface: #0F1F3D;
            --navy-card: #15294A;
            --navy-border: #1E3A5F;
            --emerald: #00C853;
            --emerald-light: #69F0AE;
            --emerald-dark: #00A844;
            --emerald-glow: rgba(0, 200, 83, 0.2);
            --emerald-glow-strong: rgba(0, 200, 83, 0.35);
            --gold: #FFD700;
            --gold-light: #FFED4A;
            --gold-dim: #B8960F;
            --gold-glow: rgba(255, 215, 0, 0.15);
            --ruby: #E53935;
            --ruby-light: #FF5252;
            --radius: 16px;
            --font-family: 'Outfit', 'Inter', sans-serif;
            --border-active: rgba(0,200,83,0.25);
            --border-subtle: rgba(255,255,255,0.06);
            --text-muted: #94A3B8;
        }

        body {
            font-family: var(--font-family);
            background: var(--navy-deep);
            color: #E2E8F0;
            min-height: 100vh;
        }

        /* ═══ SIDEBAR ═══ */
        #sidebar-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 50; display: none; backdrop-filter: blur(6px); }
        #sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 290px;
            background: linear-gradient(180deg, #0A1628 0%, #0F1F3D 100%) !important;
            border-right: 1px solid var(--border-active);
            z-index: 60; transition: transform 0.35s ease; transform: translateX(-100%);
        }
        #sidebar.open { transform: translateX(0); }
        .sb-header { padding: 32px 20px 20px; text-align: center; border-bottom: 1px solid var(--border-active); }
        .sb-brand { font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: 0.2em; }
        #sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 12px 24px; color: #E2E8F0; text-decoration: none; transition: all 0.2s; }
        #sidebar nav a:hover { background: rgba(0,200,83,0.08); color: var(--emerald); }
        #sidebar nav a.active { color: var(--emerald); font-weight: 700; background: rgba(0,200,83,0.1); }
        
        #menu-toggle {
            position: fixed; top: 16px; left: 16px; z-index: 100;
            width: 48px; height: 48px; border-radius: 14px;
            background: var(--navy-surface); border: 1px solid var(--border-active);
            color: var(--emerald); display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* ═══ EDITOR ═══ */
        main { max-width: 1000px; margin: 0 auto; padding: 80px 24px; }
        .editor-container { background: var(--navy-card); border-radius: var(--radius); padding: 32px; border: 1px solid var(--border-subtle); }
        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted); }
        input, select, textarea {
            width: 100%; background: var(--navy-surface); border: 1px solid var(--navy-border);
            border-radius: 8px; padding: 12px; color: #fff; outline: none;
        }
        input:focus { border-color: var(--emerald); }
        
        #editor { height: 400px; background: #fff; color: #000; border-radius: 0 0 8px 8px; }
        .ql-toolbar { background: #f3f4f6; border-radius: 8px 8px 0 0; }

        .btn-submit {
            width: 100%; height: 56px; background: var(--emerald); color: #000;
            font-weight: 800; border-radius: 12px; margin-top: 32px; cursor: pointer;
            transition: all 0.3s ease; border: none;
        }
        .btn-submit:hover { background: var(--emerald-light); transform: translateY(-2px); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        #global-loader {
            position: fixed; inset: 0; background: var(--navy-deep);
            z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .loader-spinner {
            width: 60px; height: 60px; border: 4px solid rgba(0,200,83,0.1);
            border-top: 4px solid var(--emerald); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="global-loader">
        <div class="loader-spinner"></div>
        <div class="sb-brand">STUDIO PeliPREX</div>
    </div>

    <button id="menu-toggle"><i class="ri-menu-2-line text-2xl"></i></button>

    <div id="sidebar-overlay"></div>
    <aside id="sidebar">
        <div class="sb-header">
            <div class="sb-brand">PeliPREX</div>
        </div>
        <div class="sb-scroll-area">
            <nav>
                <a href="nueva-historia" class="active"><i class="ri-quill-pen-line"></i> Nueva Historia</a>
                <a href="mis-historias"><i class="ri-book-read-line"></i> Mis Historias</a>
                <a href="borradores"><i class="ri-draft-line"></i> Borradores</a>
                <a href="estadisticas"><i class="ri-bar-chart-box-line"></i> Estadísticas</a>
                <a href="inicio"><i class="ri-home-4-line"></i> Inicio</a>
            </nav>
        </div>
    </aside>

    <main>
        <div class="editor-container">
            <h1 class="text-3xl font-bold mb-8" id="page-title">Crear Nueva Historia</h1>
            <form id="story-form">
                <div class="form-group">
                    <label>Título de la Obra</label>
                    <input type="text" id="titulo" placeholder="Ej: El Misterio de la Selva" required>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="categoria">
                            <option value="Fantasía">Fantasía</option>
                            <option value="Romance">Romance</option>
                            <option value="Misterio">Misterio</option>
                            <option value="Aventura">Aventura</option>
                            <option value="Terror">Terror</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="estado">
                            <option value="publicado">Publicar Ahora</option>
                            <option value="borrador">Guardar como Borrador</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Contenido</label>
                    <div id="editor"></div>
                </div>
                <button type="submit" id="submit-btn" class="btn-submit">GUARDAR HISTORIA</button>
            </form>
        </div>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const menuToggle = document.getElementById('menu-toggle');
        const loader = document.getElementById('global-loader');
        const storyForm = document.getElementById('story-form');
        const submitBtn = document.getElementById('submit-btn');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.style.display = 'none';
        });

        // Quill
        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, false] }],
                    ['bold', 'italic', 'underline'],
                    ['image', 'code-block'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }]
                ]
            }
        });

        // Detectar modo edición
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('edit');

        async function loadStoryToEdit() {
            if (!editId) return;
            document.getElementById('page-title').innerText = 'Editar Historia';
            try {
                const { data, error } = await window.supabase
                    .from('historias')
                    .select('*')
                    .eq('id', editId)
                    .single();
                
                if (error) throw error;
                if (data) {
                    document.getElementById('titulo').value = data.titulo;
                    document.getElementById('categoria').value = data.categoria;
                    document.getElementById('estado').value = data.estado;
                    quill.root.innerHTML = data.contenido_html;
                }
            } catch (err) {
                console.error('Error al cargar historia:', err);
                alert('No se pudo cargar la historia para editar.');
            }
        }

        storyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) {
                alert('Debes iniciar sesión para guardar historias.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'GUARDANDO...';

            const storyData = {
                titulo: document.getElementById('titulo').value,
                categoria: document.getElementById('categoria').value,
                estado: document.getElementById('estado').value,
                contenido_html: quill.root.innerHTML,
                autora_nombre: currentUser.user_metadata.full_name || 'Escritora Studio',
                autora_email: currentUser.email,
                user_id: currentUser.id
            };

            try {
                let result;
                if (editId) {
                    result = await window.supabase
                        .from('historias')
                        .update(storyData)
                        .eq('id', editId);
                } else {
                    result = await window.supabase
                        .from('historias')
                        .insert([storyData]);
                }

                if (result.error) throw result.error;

                alert('¡Historia guardada con éxito!');
                window.location.href = storyData.estado === 'publicado' ? 'mis-historias' : 'borradores';
            } catch (err) {
                console.error('Error al guardar:', err);
                alert('Error al guardar: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'GUARDAR HISTORIA';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(async () => {
                if (window.supabase) {
                    await loadStoryToEdit();
                }
                loader.style.opacity = '0';
                setTimeout(() => loader.style.visibility = 'hidden', 500);
            }, 1000);
        });
    </script>
</body>
</html>
