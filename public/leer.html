<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Morphosis · Lectura Inmersiva | Studio PeliPREX</title>
    
    <!-- Core Libraries & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="returnConfig.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #03050b;
            --bg-elevated: #0a0f1c;
            --glass-edge: rgba(255, 255, 255, 0.05);
            --glass-glow: rgba(0, 242, 255, 0.15);
            --accent-primary: #6ee7ff;
            --accent-glow: #00c3ff;
            --accent-secondary: #c084fc;
            --text-soft: #f1f5f9;
            --text-muted: #8ca3ba;
            --border-subtle: rgba(110, 231, 255, 0.2);
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-serif: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
            --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            background: var(--bg-deep);
            font-family: var(--font-sans);
            color: var(--text-soft);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 🌌 3D animated particle + gradient background */
        .universe-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at 20% 30%, #0b1120, #020408);
        }
        .animated-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
            pointer-events: none;
        }
        .mesh-layer {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(110, 231, 255, 0.08) 0%, transparent 60%),
                        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
            animation: driftMesh 28s infinite alternate;
        }
        .mesh-layer:nth-child(2) {
            background: radial-gradient(circle at 70% 80%, rgba(192, 132, 252, 0.08) 0%, transparent 70%);
            animation: driftMesh 36s infinite alternate-reverse;
            opacity: 0.7;
        }
        @keyframes driftMesh {
            0% { transform: translate(0%, 0%) rotate(0deg); }
            100% { transform: translate(-4%, -6%) rotate(2deg); }
        }

        /* glassmorphism premium */
        .glass-panel {
            background: rgba(10, 15, 28, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-edge);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* reading progress bar */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            z-index: 200;
            transition: width 0.1s ease;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* scrollbar premium */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0f1c;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 8px;
        }

        /* floating controls (font size) */
        .reading-tool {
            position: fixed;
            bottom: 28px;
            right: 24px;
            z-index: 120;
            display: flex;
            gap: 12px;
            background: rgba(6, 10, 20, 0.8);
            backdrop-filter: blur(20px);
            padding: 10px 18px;
            border-radius: 60px;
            border: 1px solid rgba(110, 231, 255, 0.3);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-soft);
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 38px;
            height: 38px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .tool-btn:hover {
            background: var(--accent-primary);
            color: #03050b;
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* story container */
        .story-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 28px 80px;
        }

        /* hero layout asian modern asymmetric */
        .hero-asymmetric {
            display: flex;
            flex-wrap: wrap;
            gap: 48px;
            margin-bottom: 64px;
            align-items: flex-start;
        }
        .poster-wrapper {
            flex: 0 0 280px;
            position: relative;
            transition: transform 0.3s var(--transition-smooth);
        }
        .poster-wrapper:hover {
            transform: translateY(-8px);
        }
        .poster-glow {
            position: absolute;
            inset: -8px;
            background: radial-gradient(circle, rgba(110,231,255,0.3), transparent);
            border-radius: 28px;
            filter: blur(18px);
            opacity: 0.6;
            transition: opacity 0.4s;
        }
        .story-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 28px;
            box-shadow: 0 30px 40px -20px black;
            border: 1px solid rgba(255,255,255,0.15);
            position: relative;
            z-index: 2;
        }
        .hero-info {
            flex: 1;
            min-width: 260px;
        }
        .story-title {
            font-size: clamp(2.4rem, 5vw, 4rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, var(--accent-primary), #b4f0ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .badge-cyber {
            background: rgba(110, 231, 255, 0.12);
            border: 1px solid rgba(110, 231, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-glass {
            background: rgba(255,255,255,0.02);
            border-radius: 24px;
            padding: 0.5rem 1rem;
            text-align: center;
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(255,255,255,0.05);
        }
        .meta-grid-new {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
            margin-top: 40px;
        }
        .meta-card-lux {
            background: rgba(12, 18, 30, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 1.2rem 1.5rem;
            border: 1px solid rgba(110, 231, 255, 0.1);
            transition: all 0.2s;
        }
        .meta-card-lux:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 8px 20px rgba(0,242,255,0.05);
        }

        /* reader area premium */
        .reader-luxury {
            background: rgba(3, 5, 11, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 42px;
            border: 1px solid rgba(110, 231, 255, 0.2);
            padding: 3rem 2rem;
            margin: 48px 0 32px;
            box-shadow: 0 25px 50px -12px black;
        }
        .story-body {
            max-width: 780px;
            margin: 0 auto;
            font-family: var(--font-serif);
            font-size: 1.35rem;
            line-height: 1.75;
            color: #eef2ff;
            transition: font-size 0.2s ease, line-height 0.2s;
        }
        .story-body p {
            margin-bottom: 1.8rem;
            text-align: left;
            letter-spacing: -0.003em;
        }
        .story-body p:first-child::first-letter {
            initial-letter: 2;
            font-weight: 700;
            color: var(--accent-primary);
            margin-right: 0.5rem;
            font-family: var(--font-serif);
        }
        
        @media (max-width: 780px) {
            .story-container { padding: 80px 20px 60px; }
            .reader-luxury { padding: 2rem 1.25rem; }
            .story-body { font-size: 1.2rem; }
            .reading-tool { bottom: 16px; right: 16px; padding: 6px 12px; }
        }
        @media (max-width: 640px) {
            .poster-wrapper { flex: 0 0 200px; margin: 0 auto; }
            .hero-asymmetric { justify-content: center; text-align: center; }
            .stat-glass { justify-content: center; }
        }

        /* tags & animations */
        .tag-nuance {
            background: rgba(255,255,255,0.02);
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-family: monospace;
            letter-spacing: 0.02em;
            border: 0.5px solid rgba(110,231,255,0.3);
        }
        .loading-morph {
            position: fixed;
            inset: 0;
            background: #03050b;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        .loader-neon {
            width: 70px;
            height: 70px;
            border: 2px solid rgba(110,231,255,0.2);
            border-top: 2px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .fade-up {
            animation: fadeUp 0.8s ease forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .btn-back-neon {
            background: rgba(10, 15, 28, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 36px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(110, 231, 255, 0.3);
            transition: all 0.25s;
        }
        .btn-back-neon:hover {
            border-color: var(--accent-primary);
            transform: translateX(-4px);
            box-shadow: 0 0 18px rgba(0,242,255,0.4);
        }
        .author-badge {
            background: linear-gradient(145deg, #0f1627, #070b14);
            border-radius: 80px;
            padding: 0.3rem 1rem 0.3rem 0.4rem;
        }
    </style>
</head>
<body>

<div class="universe-bg"></div>
<div class="animated-mesh">
    <div class="mesh-layer"></div>
    <div class="mesh-layer"></div>
</div>
<div class="reading-progress" id="progressBar"></div>

<!-- loading screen -->
<div id="loadingOverlay" class="loading-morph">
    <div class="loader-neon"></div>
    <p class="mt-6 text-xs tracking-[0.2em] text-cyan-300/70 uppercase font-mono">cargando universo literario</p>
</div>

<header class="fixed top-0 left-0 w-full z-50 p-5 flex justify-between items-center pointer-events-none">
    <a href="inicio" class="btn-back-neon pointer-events-auto" title="Volver al inicio">
        <i class="fas fa-arrow-left text-cyan-300 text-xl"></i>
    </a>
    <div class="pointer-events-auto flex gap-3 opacity-0 md:opacity-100">
        <div class="text-xs bg-black/30 backdrop-blur px-3 py-2 rounded-full border border-white/10 font-mono">
            <i class="fas fa-book-open text-cyan-400 mr-1"></i> <span id="readTimeLabel">Lectura</span>
        </div>
    </div>
</header>

<main id="appContent" class="story-container hidden">
    <div class="hero-asymmetric fade-up">
        <div class="poster-wrapper">
            <div class="poster-glow"></div>
            <img id="posterImg" src="" alt="portada" class="story-poster">
        </div>
        <div class="hero-info">
            <div class="flex flex-wrap gap-2 mb-4" id="badgeList"></div>
            <h1 class="story-title mb-4" id="storyTitle">-</h1>
            <div class="flex flex-wrap gap-5 mb-6">
                <div class="stat-glass"><i class="fas fa-eye text-cyan-400 mr-2"></i><span id="statViews">0</span><span class="text-xs ml-1 text-muted">vistas</span></div>
                <div class="stat-glass"><i class="fas fa-star text-yellow-400 mr-2"></i><span id="statRating">0.0</span><span class="text-xs ml-1">★</span></div>
                <div class="stat-glass"><i class="fas fa-hourglass-half text-purple-300 mr-2"></i><span id="statTime">--</span><span class="text-xs ml-1">min</span></div>
            </div>
            <p class="text-slate-300 text-lg leading-relaxed border-l-3 border-cyan-500 pl-5" id="storySinopsis"></p>
            <div class="flex items-center gap-4 mt-7 author-badge w-fit">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-white font-bold shadow-lg" id="authorAvatar">?</div>
                <div><p class="text-[11px] uppercase tracking-wider text-cyan-300">escritora</p><p class="font-semibold text-lg" id="authorName"></p></div>
            </div>
        </div>
    </div>

    <!-- lectura premium -->
    <div class="reader-luxury fade-up" style="animation-delay: 0.1s;">
        <article class="story-body" id="storyBodyHTML"></article>
    </div>

    <!-- metadata inmersiva -->
    <div class="mt-12 fade-up" style="animation-delay: 0.2s;">
        <div class="flex items-center gap-2 mb-6"><i class="fas fa-cubes text-cyan-400 text-xl"></i><span class="text-xl font-bold">esencia de la obra</span></div>
        <div class="meta-grid-new" id="metaGrid"></div>
        <div class="meta-card-lux mt-6" id="tagsContainer">
            <div class="flex items-center gap-2 mb-2"><i class="fas fa-tag text-cyan-300"></i><span class="text-sm uppercase tracking-wide">constelaciones temáticas</span></div>
            <div class="flex flex-wrap gap-2 mt-2" id="tagList"></div>
        </div>
        <div class="meta-card-lux mt-6" id="authorNoteBlock">
            <i class="fas fa-feather-alt text-cyan-300 mr-2"></i><span class="font-medium">Nota de la autora</span>
            <p id="authorNoteText" class="text-slate-400 italic mt-2 text-sm"></p>
        </div>
    </div>
</main>

<!-- Reading tools -->
<div class="reading-tool">
    <button class="tool-btn" id="decreaseFont" title="Reducir texto"><i class="fas fa-minus"></i></button>
    <button class="tool-btn" id="resetFont" title="Restablecer"><i class="fas fa-rotate-right"></i></button>
    <button class="tool-btn" id="increaseFont" title="Agrandar texto"><i class="fas fa-plus"></i></button>
</div>

<script>
    let supabaseClient = null;
    let currentStoryData = null;
    const STORAGE_FONT_KEY = 'reader_font_size';
    let currentFontSize = 1.35; // rem

    // apply font size to story-body
    function applyFontSize(sizeRem) {
        const bodyElem = document.querySelector('.story-body');
        if (bodyElem) {
            bodyElem.style.fontSize = `${sizeRem}rem`;
            bodyElem.style.lineHeight = sizeRem > 1.5 ? '1.7' : '1.75';
        }
        localStorage.setItem(STORAGE_FONT_KEY, sizeRem);
    }

    function initFontControls() {
        const saved = localStorage.getItem(STORAGE_FONT_KEY);
        if (saved && !isNaN(parseFloat(saved))) {
            currentFontSize = parseFloat(saved);
        } else {
            currentFontSize = 1.35;
        }
        applyFontSize(currentFontSize);
        document.getElementById('increaseFont')?.addEventListener('click', () => {
            if (currentFontSize < 2.1) currentFontSize += 0.1;
            applyFontSize(currentFontSize);
        });
        document.getElementById('decreaseFont')?.addEventListener('click', () => {
            if (currentFontSize > 0.95) currentFontSize -= 0.1;
            applyFontSize(currentFontSize);
        });
        document.getElementById('resetFont')?.addEventListener('click', () => {
            currentFontSize = 1.35;
            applyFontSize(currentFontSize);
        });
    }

    // reading progress
    function initScrollProgress() {
        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - window.innerHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('progressBar').style.width = scrolled + '%';
        });
    }

    async function initReader() {
        try {
            const configResp = await fetch('/api/config');
            const config = await configResp.json();
            supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
            const urlParams = new URLSearchParams(window.location.search);
            const storyId = urlParams.get('id');
            if (!storyId) throw new Error('No se especificó ningún ID de historia');
            await loadAndDisplayStory(storyId);
        } catch (err) {
            console.error(err);
            showErrorScreen(err.message || 'Error de conexión con el servidor');
        }
    }

    async function loadAndDisplayStory(id) {
        try {
            const { data, error } = await supabaseClient
                .from('historias')
                .select('*')
                .eq('id', id)
                .single();
            if (error) throw error;
            if (!data) throw new Error('La historia no está disponible');
            currentStoryData = data;

            // increment views: rpc + fallback
            try {
                const { error: rpcErr } = await supabaseClient.rpc('increment_views', { story_id: id });
                if (rpcErr) {
                    await supabaseClient.from('historias').update({ vistas: (data.vistas || 0) + 1 }).eq('id', id);
                }
            } catch(e) { console.warn(e); }

            renderPremiumUI(data);
            // fade out loading
            const loadingDiv = document.getElementById('loadingOverlay');
            loadingDiv.style.opacity = '0';
            setTimeout(() => {
                loadingDiv.classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 400);
        } catch (err) {
            showErrorScreen(err.message);
        }
    }

    function renderPremiumUI(story) {
        document.title = `${story.titulo} · Morphosis Studio`;
        // poster
        const poster = document.getElementById('posterImg');
        poster.src = story.poster_url || 'https://placehold.co/600x900/0a0f1c/6ee7ff?text=Portada';
        poster.alt = story.titulo;
        document.getElementById('storyTitle').innerText = story.titulo;
        document.getElementById('storySinopsis').innerText = story.sinopsis || 'El autor ha tejido una experiencia sin descripción, sumérgete en sus palabras.';
        document.getElementById('authorName').innerText = story.autora_nombre || 'Anónimo';
        const avatarLetter = (story.autora_nombre || 'A').charAt(0).toUpperCase();
        document.getElementById('authorAvatar').innerText = avatarLetter;
        document.getElementById('statViews').innerText = (story.vistas || 0).toLocaleString();
        document.getElementById('statRating').innerText = (story.valoracion_promedio || 0).toFixed(1);
        document.getElementById('statTime').innerText = story.tiempo_lectura || '??';
        if(story.tiempo_lectura) document.getElementById('readTimeLabel').innerHTML = `<i class="fas fa-clock"></i> ${story.tiempo_lectura} min`;

        // badges
        const badgeContainer = document.getElementById('badgeList');
        badgeContainer.innerHTML = '';
        if (story.categoria) badgeContainer.innerHTML += `<span class="badge-cyber"><i class="fas fa-layer-group mr-1 text-cyan-300"></i>${story.categoria}</span>`;
        if (story.publico) badgeContainer.innerHTML += `<span class="badge-cyber" style="border-color:#c084fc;">${story.publico}</span>`;
        
        // contenido HTML
        const bodyHtml = story.contenido_html || '<p class="italic text-center text-slate-400">El contenido de esta historia será revelado pronto.✨</p>';
        document.getElementById('storyBodyHTML').innerHTML = bodyHtml;

        // meta grid
        const metaGrid = document.getElementById('metaGrid');
        const metaItems = [
            { icon: 'globe', label: 'Idioma', value: story.idioma === 'es' ? 'Español' : (story.idioma || 'Español') },
            { icon: 'users', label: 'Público', value: story.publico || 'Todos los públicos' },
            { icon: 'calendar-alt', label: 'Publicación', value: story.fecha_publicacion ? new Date(story.fecha_publicacion).toLocaleDateString('es-ES', { year:'numeric', month:'long', day:'numeric' }) : '—' },
            { icon: 'copyright', label: 'Derechos', value: story.derechos === 'todos' ? 'Reservados' : (story.derechos || 'Creative Commons') },
            { icon: 'bookmark', label: 'Estado', value: story.estado || 'Publicado' },
            { icon: 'list-ol', label: 'Orden', value: story.orden_indice === 0 ? 'Obra completa' : `Capítulo ${story.orden_indice}` }
        ];
        metaGrid.innerHTML = metaItems.map(item => `
            <div class="meta-card-lux flex flex-col gap-2">
                <i class="fas fa-${item.icon} text-cyan-400 text-lg"></i>
                <span class="text-[11px] uppercase tracking-wider text-slate-400">${item.label}</span>
                <span class="font-medium text-white">${item.value}</span>
            </div>
        `).join('');

        // tags
        const tagListDiv = document.getElementById('tagList');
        tagListDiv.innerHTML = '';
        if (story.tags && story.tags.trim()) {
            story.tags.split(',').forEach(tag => {
                const clean = tag.trim();
                if(clean) tagListDiv.innerHTML += `<span class="tag-nuance">#${clean}</span>`;
            });
        } else {
            tagListDiv.innerHTML = '<span class="text-slate-500 text-sm">sin etiquetas</span>';
        }

        // nota autora
        const noteElem = document.getElementById('authorNoteText');
        noteElem.innerText = story.nota_autora || 'El autor decidió dejar que la obra hable por sí misma.';
        
        // extra: configurar controles de fuente despues de tener el DOM
        initFontControls();
        initScrollProgress();

        // suave animación a elementos
        const fadeItems = document.querySelectorAll('.fade-up');
        fadeItems.forEach((el,idx) => { el.style.opacity = '1'; });
    }

    function showErrorScreen(msg) {
        const loadingDiv = document.getElementById('loadingOverlay');
        loadingDiv.innerHTML = `
            <div class="text-center max-w-md px-6">
                <i class="fas fa-meteor text-6xl text-cyan-400 mb-6"></i>
                <h2 class="text-3xl font-bold mb-3">Horizonte incierto</h2>
                <p class="text-slate-400 mb-8">${msg}</p>
                <a href="inicio" class="inline-flex items-center gap-3 bg-white/5 backdrop-blur border border-cyan-400/40 py-3 px-8 rounded-full hover:bg-cyan-400/10 transition">
                    <i class="fas fa-home"></i> Regresar al inicio
                </a>
            </div>
        `;
