<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Mi Perfil Profesional | Studio PeliPREX - Masitaprex</title>
    <meta name="description" content="Tu espacio personal en Studio PeliPREX. Administra tus datos de escritor/a y opciones de cuenta.">
    <meta name="keywords" content="perfil, escritor, ajustes, cerrar sesión, eliminar cuenta, masitaprex" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/747/747965.png">
    
    <!-- Fuentes premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="returnConfig.js"></script>

    <style>
        :root {
            --bg-base: #060B14;
            --bg-surface: rgba(15, 23, 42, 0.6);
            --bg-card: rgba(30, 41, 59, 0.4);
            --emerald: #00E676;
            --emerald-dim: rgba(0, 230, 118, 0.15);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(0, 230, 118, 0.4);
            --danger: #FF4757;
            --font-app: 'Plus Jakarta Sans', 'Outfit', sans-serif;
            --font-serif: 'Cormorant Garamond', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-app);
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Fondos 3D y Ambientales */
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 15% 50%, rgba(0, 230, 118, 0.04), transparent 40%),
                        radial-gradient(circle at 85% 20%, rgba(124, 58, 237, 0.04), transparent 40%);
            z-index: -1; pointer-events: none;
        }
        
        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background-image: 
                radial-gradient(at 80% 0%, hsla(189,100%,56%,0.05) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,0.02) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(240,100%,70%,0.05) 0px, transparent 50%);
            filter: blur(80px);
        }

        /* --- BARRA SUPERIOR FIJA (HEADER) --- */
        #top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 95;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        #menu-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        #menu-toggle:hover {
            color: var(--emerald);
            border-color: var(--emerald-dim);
            background: rgba(0,230,118,0.08);
            transform: scale(1.05);
        }

        .header-title {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 600;
            font-style: italic;
            color: #fff;
            letter-spacing: 0.02em;
            text-align: center;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0 12px;
        }

        #header-gear {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        #header-gear:hover {
            color: var(--emerald);
            border-color: var(--emerald-dim);
            background: rgba(0,230,118,0.08);
            transform: rotate(30deg);
        }

        /* Sidebar (Conservado) */
        #sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 50; opacity: 0; display: none; transition: 0.3s; }
        #sidebar-overlay.opacity-100 { opacity: 1; }
        #sidebar { position: fixed; top: 0; left: 0; height: 100%; width: 280px; background: rgba(10, 15, 30, 0.95); border-right: 1px solid var(--border-light); z-index: 60; transform: translateX(-100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; backdrop-filter: blur(20px); }
        #sidebar.open { transform: translateX(0); }
        
        .sb-header { padding: 40px 24px 24px; text-align: center; }
        .sb-logo-box { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 22px; border: 1px solid var(--border-light); background: linear-gradient(145deg, rgba(255,255,255,0.05), transparent); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,230,118,0.1); padding: 12px; }
        .sb-logo-box img { width: 100%; height: 100%; object-fit: contain; }
        .sb-brand { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem; color: #fff; letter-spacing: 0.1em; }
        
        #sidebar nav { padding: 10px 16px; flex: 1; }
        .sb-cat { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted); margin: 20px 0 10px 12px; font-weight: 700; }
        #sidebar nav a { display: flex; align-items: center; gap: 14px; padding: 14px 16px; color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; border-radius: 16px; transition: all 0.3s; margin-bottom: 4px; }
        #sidebar nav a:hover { color: #fff; background: rgba(255,255,255,0.03); transform: translateX(4px); }
        #sidebar nav a.active { color: var(--emerald); background: var(--emerald-dim); }
        .sb-icon { font-size: 1.2rem; }

        /* LAYOUT PRINCIPAL */
        .layout-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 24px 60px; /* espacio para el header fijo */
            position: relative;
            z-index: 1;
        }

        /* Formularios de perfil */
        .profile-section { }
        .pane-header { margin-bottom: 40px; text-align: center; }
        .pane-header h2 { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 8px; letter-spacing: -0.02em; }
        .pane-header p { color: var(--text-muted); font-size: 1rem; line-height: 1.6; max-width: 500px; margin: 0 auto; }

        .fluid-group { margin-bottom: 32px; position: relative; }
        .fluid-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px; }
        
        .label-premium {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .label-premium i { color: var(--emerald); font-size: 1rem; }
        
        .input-premium, .select-premium, .textarea-premium {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border-light);
            padding: 12px 0 16px 0;
            color: #fff;
            font-family: var(--font-app);
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        .input-premium:focus, .select-premium:focus, .textarea-premium:focus {
            outline: none;
            border-bottom-color: var(--emerald);
            box-shadow: 0 10px 20px -10px var(--emerald-dim);
        }
        .input-premium::placeholder, .textarea-premium::placeholder { color: rgba(255,255,255,0.2); font-weight: 400; }
        .textarea-premium { min-height: 100px; resize: vertical; line-height: 1.6; }
        
        /* Avatar Premium */
        .avatar-hero { display: flex; align-items: center; gap: 32px; margin-bottom: 48px; }
        .avatar-circle {
            width: 120px; height: 120px; border-radius: 50%; padding: 4px;
            background: linear-gradient(135deg, var(--emerald), #10B981);
            position: relative;
            box-shadow: 0 20px 40px rgba(0,230,118,0.2);
            flex-shrink: 0;
        }
        .avatar-inner {
            width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
            background: var(--bg-base);
            display: flex; align-items: center; justify-content: center;
            border: 4px solid var(--bg-base);
        }
        .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-inner i { font-size: 3rem; color: var(--text-muted); }
        
        .divider {
            height: 1px;
            background: linear-gradient(90deg, var(--border-light), transparent);
            margin: 48px 0;
            border: none;
        }

        /* Botón Guardar */
        .btn-glow {
            background: linear-gradient(135deg, var(--emerald), #059669);
            color: #000;
            border: none;
            padding: 18px 40px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 12px 30px rgba(0,230,118,0.3);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            text-decoration: none;
        }
        .btn-glow:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0,230,118,0.4);
            filter: brightness(1.1);
        }

        /* Sección Ajustes de Cuenta */
        .account-actions {
            margin-top: 64px;
            padding-top: 32px;
            border-top: 1px solid var(--border-light);
        }
        .account-actions h3 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 600;
            font-style: italic;
            color: #fff;
            margin-bottom: 32px;
            text-align: center;
        }

        .account-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 16px;
            padding: 16px 24px;
            border-radius: 20px;
            font-family: var(--font-app);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-logout {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border-color: var(--border-light);
            backdrop-filter: blur(8px);
        }
        .btn-logout:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--text-muted);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .btn-delete {
            background: rgba(255,71,87,0.08);
            color: var(--danger);
            border-color: rgba(255,71,87,0.3);
            backdrop-filter: blur(8px);
        }
        .btn-delete:hover {
            background: rgba(255,71,87,0.15);
            border-color: var(--danger);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,71,87,0.2);
        }

        /* Social Inputs Fluidos */
        .social-row {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 2px solid var(--border-light);
            padding: 8px 0;
            transition: 0.3s;
        }
        .social-row:focus-within { border-bottom-color: var(--emerald); }
        .social-row i { font-size: 1.4rem; color: var(--text-muted); width: 30px; text-align: center; }
        .social-row input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.05rem;
            outline: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            #top-header {
                padding: 0 12px;
            }
            .header-title {
                font-size: 1.3rem;
            }
            .layout-wrapper {
                padding: 90px 16px 40px;
            }
            .avatar-hero {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
            .fluid-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .account-btn {
                max-width: 100%;
            }
        }

        /* Modal Rediseñado */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-light);
            border-radius: 32px;
            padding: 48px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: modalScale 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalScale {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .m-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 24px;
        }
        .m-title { font-size: 1.5rem; font-weight: 800; color: #fff; margin-bottom: 12px; }
        .m-desc { color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; }
        .m-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .m-btn:hover { background: var(--emerald); }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <!-- Sidebar overlay -->
    <div id="sidebar-overlay"></div>

    <!-- Barra superior fija -->
    <header id="top-header">
        <button id="menu-toggle" aria-label="Abrir menú principal"><i class="ri-menu-4-line"></i></button>
        <h1 class="header-title">Identidad Literaria</h1>
        <button id="header-gear" aria-label="Ir a ajustes de cuenta" title="Ajustes de cuenta"><i class="ri-settings-3-line"></i></button>
    </header>

    <!-- Menú Lateral Studio PeliPREX -->
    <aside id="sidebar">
        <div class="sb-header">
            <div class="sb-logo-box"><img src="https://cdn-icons-png.flaticon.com/128/747/747965.png" alt="Logo"></div>
            <div class="sb-brand">STUDIO PELIPREX</div>
        </div>
        <nav>
            <div class="sb-cat">Principal</div>
            <a href="inicio"><i class="ri-home-smile-2-line sb-icon"></i> Inicio</a>
            <a href="cuenta" class="active"><i class="ri-user-6-line sb-icon"></i> Mi Perfil</a>
            
            <div class="sb-cat" style="margin-top: 30px;">Creación</div>
            <a href="nueva-historia"><i class="ri-quill-pen-line sb-icon"></i> Escribir Obra</a>
            <a href="mis-historias"><i class="ri-book-3-line sb-icon"></i> Mis Libros</a>
            <a href="borradores"><i class="ri-draft-line sb-icon"></i> Borradores</a>
            <a href="estadisticas.html"><i class="ri-bar-chart-box-line sb-icon"></i> Audiencia</a>
        </nav>
    </aside>

    <!-- Contenido principal -->
    <main class="layout-wrapper">
        
        <!-- PERFIL DE AUTOR (visible por defecto) -->
        <section class="profile-section">
            <div class="pane-header">
                <h2>Tu identidad literaria</h2>
                <p>Diseña cómo te perciben tus lectores en el universo de Studio PeliPREX.</p>
            </div>

            <div class="avatar-hero">
                <div class="avatar-circle">
                    <div class="avatar-inner" id="avatar-preview">
                        <i class="ri-user-smile-line"></i>
                    </div>
                </div>
                <div style="flex:1;">
                    <label class="label-premium"><i class="ri-image-add-line"></i> Fotografía / Avatar</label>
                    <input type="text" class="input-premium" id="campo-foto-perfil" placeholder="Pega la URL de tu imagen aquí (JPG, PNG)..." onchange="updateAvatarPreview(this.value)">
                </div>
            </div>

            <div class="fluid-grid">
                <div class="fluid-group">
                    <label class="label-premium"><i class="ri-quill-pen-fill"></i> Seudónimo Artístico</label>
                    <input type="text" class="input-premium" id="campo-autora" placeholder="El nombre que verán tus lectores">
                </div>
                <div class="fluid-group">
                    <label class="label-premium"><i class="ri-profile-line"></i> Nombre Real</label>
                    <input type="text" class="input-premium" id="campo-nombre-completo" placeholder="Opcional y privado">
                </div>
            </div>

            <div class="fluid-grid">
                <div class="fluid-group">
                    <label class="label-premium"><i class="ri-mail-send-line"></i> Correo de Contacto</label>
                    <input type="email" class="input-premium" id="campo-email" placeholder="Para editoriales y lectores">
                </div>
                <div class="fluid-group">
                    <label class="label-premium"><i class="ri-map-pin-user-line"></i> Ubicación</label>
                    <input type="text" class="input-premium" id="campo-ubicacion" placeholder="País o Ciudad mágica">
                </div>
            </div>

            <div class="fluid-group" style="margin-top: 16px;">
                <label class="label-premium"><i class="ri-double-quotes-l"></i> Frase Insignia</label>
                <input type="text" class="input-premium" id="campo-frase" placeholder="Una línea que resuma tu esencia como escritor/a...">
            </div>

            <div class="fluid-group">
                <label class="label-premium"><i class="ri-file-paper-2-line"></i> Tu Biografía</label>
                <textarea class="textarea-premium" id="campo-biografia" placeholder="Cuenta tu historia. ¿Qué te inspira? ¿Qué mundos creas? Atrae a tu audiencia..."></textarea>
            </div>

            <hr class="divider">
            <div class="pane-header" style="margin-bottom: 24px;">
                <h2 style="font-size: 1.5rem;">Ecosistema Digital</h2>
            </div>

            <div class="fluid-grid">
                <div class="fluid-group">
                    <label class="label-premium">Sitio Web</label>
                    <div class="social-row">
                        <i class="ri-links-line"></i>
                        <input type="url" id="campo-sitio-web" placeholder="tu-portafolio.com">
                    </div>
                </div>
                <div class="fluid-group">
                    <label class="label-premium">Instagram</label>
                    <div class="social-row">
                        <i class="ri-instagram-line"></i>
                        <input type="text" id="social-instagram" placeholder="@usuario">
                    </div>
                </div>
                <div class="fluid-group">
                    <label class="label-premium">X / Twitter</label>
                    <div class="social-row">
                        <i class="ri-twitter-x-line"></i>
                        <input type="text" id="social-twitter" placeholder="@usuario">
                    </div>
                </div>
                <div class="fluid-group">
                    <label class="label-premium">Facebook</label>
                    <div class="social-row">
                        <i class="ri-facebook-circle-line"></i>
                        <input type="text" id="social-facebook" placeholder="Enlace a tu página">
                    </div>
                </div>
            </div>

            <div style="margin-top: 40px;">
                <button class="btn-glow" id="saveProfileBtn" style="display: block; width: 100%;">
                    Guardar cambios
                </button>
            </div>

            <!-- Ajustes de Cuenta (final de la interfaz) -->
            <div class="account-actions" id="ajustes-cuenta">
                <h3>Ajustes de Cuenta</h3>
                <button class="account-btn btn-logout" id="logoutBtn">
                    <i class="ri-logout-box-r-line"></i> Cerrar Sesión
                </button>
                <button class="account-btn btn-delete" id="deleteAccountBtn">
                    <i class="ri-user-unfollow-line"></i> Eliminar Cuenta
                </button>
            </div>
        </section>
    </main>

    <!-- Modal genérico -->
    <div class="modal-overlay" id="actionModal">
        <div class="modal-card">
            <div class="m-icon" id="modalIcon"><i class="ri-check-line"></i></div>
            <h2 class="m-title" id="modalTitle">Éxito</h2>
            <p class="m-desc" id="modalDesc">Operación completada correctamente.</p>
            <button class="m-btn" id="modalCloseBtn">Entendido</button>
        </div>
    </div>

    <script>
        // --- 1. MENÚ LATERAL PRINCIPAL (Studio PeliPREX) ---
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        
        function toggleMenu() {
            const isOpen = sidebar.classList.toggle('open');
            if (isOpen) {
                overlay.style.display = 'block';
                document.body.style.overflow = 'hidden';
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                overlay.classList.remove('opacity-100');
                document.body.style.overflow = '';
                setTimeout(() => overlay.style.display = 'none', 300);
            }
        }
        menuToggle.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // --- 2. ICONO ENGRANAJE (SCROLL A AJUSTES DE CUENTA) ---
        document.getElementById('header-gear').addEventListener('click', () => {
            const target = document.getElementById('ajustes-cuenta');
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });

        // --- 3. LÓGICA SUPABASE Y FUNCIONES BASE ---
        let supabaseClient;
        let currentUser;

        async function initApp() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                const session = await ReturnConfig.checkAuth(supabaseClient);
                if (session) {
                    currentUser = session.user;
                    await loadProfile();
                } else {
                    window.location.href = 'login';
                }
            } catch (error) {
                console.error('Error init:', error);
            }
        }
        initApp();

        function updateAvatarPreview(url) {
            const container = document.getElementById('avatar-preview');
            if (url && url.startsWith('http')) {
                container.innerHTML = `<img src="${url}" onerror="this.innerHTML='<i class=\'ri-user-smile-line\'></i>'">`;
            } else {
                container.innerHTML = '<i class="ri-user-smile-line"></i>';
            }
        }

        async function loadProfile() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                
                if (!error && data) {
                    document.getElementById('campo-autora').value = data.autora_nombre || '';
                    document.getElementById('campo-nombre-completo').value = data.nombre_completo || '';
                    document.getElementById('campo-email').value = data.autora_email || currentUser.email;
                    document.getElementById('campo-ubicacion').value = data.pais_ciudad || '';
                    document.getElementById('campo-frase').value = data.frase_personal || '';
                    document.getElementById('campo-biografia').value = data.biografia || '';
                    document.getElementById('campo-sitio-web').value = data.sitio_web || '';
                    document.getElementById('campo-foto-perfil').value = data.foto_perfil_url || '';
                    
                    updateAvatarPreview(data.foto_perfil_url);

                    const redes = data.redes_sociales || {};
                    document.getElementById('social-instagram').value = redes.instagram || '';
                    document.getElementById('social-twitter').value = redes.twitter || '';
                    document.getElementById('social-facebook').value = redes.facebook || '';
                }
            } catch(e) { console.error('Error loading profile:', e); }
        }

        async function saveProfile() {
            const redes = {
                instagram: document.getElementById('social-instagram').value.trim(),
                twitter: document.getElementById('social-twitter').value.trim(),
                facebook: document.getElementById('social-facebook').value.trim()
            };

            const profileData = {
                id: currentUser.id,
                autora_nombre: document.getElementById('campo-autora').value.trim(),
                nombre_completo: document.getElementById('campo-nombre-completo').value.trim(),
                autora_email: document.getElementById('campo-email').value.trim(),
                pais_ciudad: document.getElementById('campo-ubicacion').value.trim(),
                frase_personal: document.getElementById('campo-frase').value.trim(),
                biografia: document.getElementById('campo-biografia').value.trim(),
                sitio_web: document.getElementById('campo-sitio-web').value.trim(),
                foto_perfil_url: document.getElementById('campo-foto-perfil').value.trim(),
                redes_sociales: redes,
                updated_at: new Date()
            };

            if (!profileData.autora_nombre) {
                showModal('Autor Anónimo', 'Debes elegir un seudónimo o nombre para guardar tu perfil.', 'warning', 'ri-error-warning-line');
                return;
            }

            const btn = document.getElementById('saveProfileBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Guardando...';

            try {
                const { error } = await supabaseClient.from('profiles').upsert(profileData, { onConflict: 'id' });
                if (error) throw error;
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    showModal('Perfil Actualizado', 'Tu identidad literaria brilla con luz propia.', 'success', 'ri-checkbox-circle-fill');
                }, 800);
            } catch (err) {
                btn.innerHTML = originalText;
                showModal('Error de Conexión', 'El universo no pudo guardar los cambios: ' + err.message, 'warning', 'ri-wifi-off-line');
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'inicio';
        }

        function requestDeleteAccount() {
            showModal('Advertencia Severa', 'Para eliminar tu cuenta y todas tus obras literarias permanentemente, contacta a soporte@masitaprex.com', 'warning', 'ri-alert-fill');
        }

        function showModal(title, desc, type = 'success', customIcon = null) {
            const modal = document.getElementById('actionModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            
            const iconEl = document.getElementById('modalIcon');
            if(customIcon) {
                iconEl.innerHTML = `<i class="${customIcon}"></i>`;
                iconEl.style.color = type === 'warning' ? '#FF4757' : (type === 'success' ? '#00E676' : '#94A3B8');
                iconEl.style.background = type === 'warning' ? 'rgba(255,71,87,0.1)' : (type === 'success' ? 'rgba(0,230,118,0.1)' : 'rgba(255,255,255,0.05)');
            } else {
                iconEl.innerHTML = '<i class="ri-check-line"></i>';
                iconEl.style.color = '#00E676';
                iconEl.style.background = 'rgba(0,230,118,0.1)';
            }
            
            modal.style.display = 'flex';
        }

        // --- 4. EVENT LISTENERS PARA BOTONES ---
        document.getElementById('saveProfileBtn').addEventListener('click', saveProfile);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('deleteAccountBtn').addEventListener('click', requestDeleteAccount);
        document.getElementById('modalCloseBtn').addEventListener('click', () => {
            document.getElementById('actionModal').style.display = 'none';
        });

    </script>
</body>
</html>
